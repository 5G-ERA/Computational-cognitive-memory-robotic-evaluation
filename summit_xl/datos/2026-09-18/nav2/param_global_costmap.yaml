/robot/global_costmap/global_costmap:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    always_send_full_costmap: true
    filters: []
    footprint: '[[0.361,-0.3065],[0.361,0.3065],[-0.361,0.3065],[-0.361,-0.3065]]'
    footprint_padding: 0.02
    global_frame: robot_map
    height: 5
    inflation_layer:
      cost_scaling_factor: 4.0
      enabled: true
      inflate_around_unknown: false
      inflate_unknown: false
      inflation_radius: 1.5
      plugin: nav2_costmap_2d::InflationLayer
    lethal_cost_threshold: 100
    map_topic: /robot/map
    observation_sources: ''
    obstacle_layer:
      combination_method: 1
      enabled: true
      footprint_clearing_enabled: false
      max_obstacle_height: 2.0
      min_obstacle_height: 0.0
      observation_sources: top_laser_scan
      plugin: nav2_costmap_2d::ObstacleLayer
      top_laser_scan:
        clearing: true
        data_type: LaserScan
        expected_update_rate: 10.0
        inf_is_valid: true
        marking: true
        max_obstacle_height: 1.0
        min_obstacle_height: 0.0
        observation_persistence: 1.0
        obstacle_max_range: 5.5
        obstacle_min_range: 0.0
        raytrace_max_range: 6.0
        raytrace_min_range: 0.0
        sensor_frame: ''
        topic: /robot/top_laser/scan
    origin_x: 0.0
    origin_y: 0.0
    plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
    publish_frequency: 1.0
    resolution: 0.02
    robot_base_frame: robot_base_footprint
    robot_radius: 0.1
    rolling_window: false
    static_layer:
      enabled: true
      footprint_clearing_enabled: false
      map_subscribe_transient_local: true
      map_topic: /robot/map_nav
      plugin: nav2_costmap_2d::StaticLayer
      subscribe_to_updates: false
      transform_tolerance: 0.0
    track_unknown_space: true
    transform_tolerance: 0.5
    trinary_costmap: true
    unknown_cost_value: 255
    update_frequency: 1.0
    use_maximum: false
    use_sim_time: false
    width: 5

