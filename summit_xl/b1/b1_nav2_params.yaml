amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    always_reset_initial_pose: false
    base_frame_id: robot_base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    first_map_only: false
    global_frame_id: robot_map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    map_topic: map
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: robot_odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: /robot/top_laser/scan
    set_initial_pose: true
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
bt_navigator:
  ros__parameters:
    always_reload_bt_xml: false
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: true
    global_frame: robot_map
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    odom_topic: /robot/robotnik_base_control/odom
    path_blackboard_id: path
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    robot_base_frame: robot_base_footprint
    transform_tolerance: 0.5
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      use_final_approach_orientation: false
    expected_planner_frequency: 0.2
    planner_plugins:
    - GridBased
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    footprint_topic: local_costmap/published_footprint
    global_frame: robot_map
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    robot_base_frame: robot_base_footprint
    rotational_acc_lim: 3.2
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors/Spin
    transform_tolerance: 0.5
    wait:
      plugin: nav2_behaviors/Wait
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    max_velocity:
    - 0.25
    - 0.0
    - 0.6
    min_velocity:
    - -0.25
    - 0.0
    - -0.6
    odom_duration: 0.1
    odom_topic: /robot/robotnik_base_control/odom
    scale_velocities: false
    smoothing_frequency: 20.0
    velocity_timeout: 0.2
smoother_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      w_data: 0.2
      w_smooth: 0.3
    smoother_plugins:
    - simple_smoother
    transform_tolerance: 0.1
map_server:
  ros__parameters:
    frame_id: robot_map
    topic_name: map
    yaml_filename: mapa_robot/rbk_2026_09_17_16_23_20.yaml
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.361,-0.3065],[0.361,0.3065],[-0.361,0.3065],[-0.361,-0.3065]]'
      footprint_padding: 0.02
      global_frame: robot_map
      height: 8
      lethal_cost_threshold: 100
      map_topic: /robot/map
      origin_x: 0.0
      origin_y: 0.0
      plugins:
      - top_laser_obstacle_layer
      publish_frequency: 5.0
      resolution: 0.02
      robot_base_frame: robot_base_footprint
      robot_radius: 0.1
      rolling_window: true
      top_laser_obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: true
        front_right_scan:
          clearing: true
          data_type: LaserScan
          expected_update_rate: 10.0
          inf_is_valid: false
          marking: true
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          observation_persistence: 0.0
          obstacle_max_range: 10.5
          obstacle_min_range: 0.0
          raytrace_max_range: 11.0
          raytrace_min_range: 0.0
          sensor_frame: ''
          topic: /robot/top_laser/scan
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_sources: front_right_scan
        plugin: nav2_costmap_2d::ObstacleLayer
      track_unknown_space: false
      transform_tolerance: 0.5
      trinary_costmap: true
      unknown_cost_value: 255
      update_frequency: 10.0
      use_maximum: false
      width: 8
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.361,-0.3065],[0.361,0.3065],[-0.361,0.3065],[-0.361,-0.3065]]'
      footprint_padding: 0.02
      global_frame: robot_map
      height: 5
      inflation_layer:
        cost_scaling_factor: 10.0
        enabled: true
        inflate_around_unknown: false
        inflate_unknown: false
        inflation_radius: 0.15
        plugin: nav2_costmap_2d::InflationLayer
      lethal_cost_threshold: 100
      map_topic: /robot/map
      obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: false
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_sources: top_laser_scan
        plugin: nav2_costmap_2d::ObstacleLayer
        top_laser_scan:
          clearing: true
          data_type: LaserScan
          expected_update_rate: 10.0
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          observation_persistence: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          sensor_frame: ''
          topic: /robot/top_laser/scan
      origin_x: 0.0
      origin_y: 0.0
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.02
      robot_base_frame: robot_base_footprint
      robot_radius: 0.1
      rolling_window: false
      static_layer:
        enabled: true
        footprint_clearing_enabled: false
        map_subscribe_transient_local: true
        map_topic: /robot/map
        plugin: nav2_costmap_2d::StaticLayer
        subscribe_to_updates: false
        transform_tolerance: 0.0
      track_unknown_space: true
      transform_tolerance: 0.5
      trinary_costmap: true
      unknown_cost_value: 255
      update_frequency: 1.0
      use_maximum: false
      width: 5
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: -0.15
      min_vel_y: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -0.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      ObstacleFootprint.scale: 0.02
    odom_topic: /robot/robotnik_base_control/odom
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
